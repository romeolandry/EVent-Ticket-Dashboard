server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # config.js est régénéré à chaque démarrage : ne jamais le mettre en cache
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # SPA : tout le reste retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
